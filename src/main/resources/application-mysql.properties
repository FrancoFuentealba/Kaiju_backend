# Perfil MySQL. Ejecutar con: --spring.profiles.active=mysql
# Los datos de conexión se leen de variables de entorno (no se escriben claves en el repositorio).
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:kaiju}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
