spring.application.name=kaiju-backend
server.port=8080

# Base de datos por defecto: H2 guardada en el archivo ./data/kaiju (persiste entre ejecuciones)
spring.datasource.url=jdbc:h2:file:./data/kaiju;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# Crea y actualiza las tablas solas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Carga datos ficticios la primera vez (si la tabla de productos está vacía)
kaiju.seed=true
